services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-giftme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giftme}
      POSTGRES_DB: ${POSTGRES_DB:-giftme_api}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-giftme} -d ${POSTGRES_DB:-giftme_api}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescreve o DATABASE_URL do .env: dentro da rede do compose, o Postgres é alcançado
      # pelo nome do serviço ("postgres"), não por "localhost".
      DATABASE_URL: postgres://${POSTGRES_USER:-giftme}:${POSTGRES_PASSWORD:-giftme}@postgres:5432/${POSTGRES_DB:-giftme_api}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src:delegated
      - ./tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
